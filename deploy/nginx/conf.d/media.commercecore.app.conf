# HTTPS reverse proxy for MinIO, for when nginx is shared with another dockerized project on
# the same VM (see deploy/README.md's "Sharing nginx with another project on the same VM"
# section) – for a standalone host-installed nginx, use ../media.commercecore.app.conf
# instead. Serves product images at https://media.commercecore.app/<bucket>/<key> – see
# CatalogService's Minio:PublicBaseUrl and MinioBlobStorageService.GetPublicUrl.
#
# Proxies by Docker container name (minio:9000) rather than 127.0.0.1:9000 – see
# api.commercecore.app.conf's comment for why, and for the cert/resolver notes (both apply
# here identically).
server {
    listen 443 ssl;
    http2 on;
    server_name media.commercecore.app;

    ssl_certificate     /etc/letsencrypt/live/api.commercecore.app/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.commercecore.app/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;

    # Product images can be a few hundred KB - default client_max_body_size (1m) is fine for
    # GETs (serving images) but if presigned uploads ever route through this host instead of
    # going straight to MinIO, raise this.
    client_max_body_size 20m;

    location / {
        set $upstream minio:9000;
        proxy_pass http://$upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
