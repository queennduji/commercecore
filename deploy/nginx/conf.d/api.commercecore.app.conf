# HTTPS reverse proxy for cc-api-gateway, for when nginx is shared with another dockerized
# project on the same VM (see deploy/README.md's "Sharing nginx with another project on the
# same VM" section) — for a standalone host-installed nginx, use
# ../api.commercecore.app.conf instead.
#
# Proxies by Docker container name (cc-api-gateway:8080) rather than 127.0.0.1:8080 since
# this nginx and cc-api-gateway are both containers on the `commercecore` network, not host
# processes — the other project's nginx joins that network as `external: true` to reach it.
# `resolver` (needed for the $upstream variable trick below, so nginx doesn't fail to start
# if this container isn't up yet) is declared once in the other project's main nginx.conf —
# this file inherits it since conf.d snippets are included inside the same http{} block.
#
# The cert is provisioned and renewed by the OTHER project's certbot container (shared
# certbot-conf volume) — see that project's nginx setup for the actual certbot invocation.
# It's named after this domain because it was the first -d passed to certbot, but the same
# cert covers media.commercecore.app too (issued as one SAN cert covering both).
server {
    listen 443 ssl;
    http2 on;
    server_name api.commercecore.app;

    ssl_certificate     /etc/letsencrypt/live/api.commercecore.app/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.commercecore.app/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;

    location / {
        set $upstream cc-api-gateway:8080;
        proxy_pass http://$upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
