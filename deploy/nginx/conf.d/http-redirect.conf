# HTTP -> HTTPS redirect for both CommerceCore hostnames, plus the ACME HTTP-01 challenge
# path certbot needs to issue/renew the cert. Only used when nginx is shared with another
# dockerized project on the same VM (see deploy/README.md's "Sharing nginx with another
# project on the same VM" section) – for a standalone host-installed nginx, use
# ../api.commercecore.app.conf and ../media.commercecore.app.conf instead, which certbot's
# --nginx plugin rewrites in place.
server {
    listen 80;
    listen [::]:80;
    server_name api.commercecore.app media.commercecore.app;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}
