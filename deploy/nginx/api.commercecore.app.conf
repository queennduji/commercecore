# Reverse proxy for the CommerceCore ApiGateway container (deploy/docker-compose.prod.yml
# publishes it on the host at localhost:8080). Copy this file to nginx's sites-available/ on the
# VM, symlink it into sites-enabled/, then run certbot to provision HTTPS - see deploy/README.md.
# This is a plain HTTP server block on purpose: certbot's --nginx plugin rewrites it in place to
# add the listen 443 ssl / certificate directives once the cert is issued, rather than needing
# them hand-written here first.

server {
    listen 80;
    listen [::]:80;
    server_name api.commercecore.app;

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
