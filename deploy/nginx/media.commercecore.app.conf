# Reverse proxy for the MinIO container (deploy/docker-compose.prod.yml publishes it on the host
# at localhost:9000). Serves product images at https://media.commercecore.app/<bucket>/<key> -
# see CatalogService's Minio:PublicBaseUrl and MinioBlobStorageService.GetPublicUrl. Copy this
# file to nginx's sites-available/ on the VM, symlink it into sites-enabled/, then run certbot -
# see deploy/README.md. Plain HTTP block for the same reason as api.commercecore.app.conf.

server {
    listen 80;
    listen [::]:80;
    server_name media.commercecore.app;

    # Product images can be a few hundred KB - default client_max_body_size (1m) is fine for
    # GETs (serving images) but if presigned uploads ever route through this host instead of
    # going straight to MinIO, raise this.
    client_max_body_size 20m;

    location / {
        proxy_pass http://127.0.0.1:9000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
