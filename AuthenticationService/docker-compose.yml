services:
  auth-postgres:
    image: postgres:16
    networks:
      - commercecore
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: authentication_service
    ports:
      - "5433:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  authentication-service:
    build:
      context: .
      dockerfile: Dockerfile
    networks:
      - commercecore
    depends_on:
      auth-postgres:
        condition: service_healthy
    ports:
      - "8085:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__AuthDatabase: "Host=auth-postgres;Port=5432;Database=authentication_service;Username=postgres;Password=postgres"
      Kafka__BootstrapServers: "kafka:29092"
      Kafka__SchemaRegistryUrl: "http://schema-registry:8081"
      Otel__TracesEndpoint: "http://jaeger:4317"
      Otel__LogsEndpoint: "http://otel-collector:4317"

networks:
  commercecore:
    external: true
    name: commercecore

volumes:
  postgres-data:
